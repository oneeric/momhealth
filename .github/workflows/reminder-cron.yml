name: Medication Reminder Scheduler

on:
  # Times are UTC; Taiwan is UTC+8.
  # Medication reminders (retry mode):
  # - Retry every minute from 10 minutes before target time
  # - API will block early sends before target HH:MM
  # - Once sent, dedupe prevents duplicates
  # TW 07:00 window => UTC 22:50-22:59 and 23:00-23:10 (previous day)
  # TW 08:00 window => UTC 23:50-23:59 (previous day) and 00:00-00:10
  # TW 12:00 window => UTC 03:50-03:59 and 04:00-04:10
  # TW 18:00 window => UTC 09:50-09:59 and 10:00-10:10
  # TW 21:00 window => UTC 12:50-12:59 and 13:00-13:10
  schedule:
    - cron: "50-59 22 * * *"
    - cron: "0-10 23 * * *"
    - cron: "50-59 23 * * *"
    - cron: "0-10 0 * * *"
    - cron: "50-59 3 * * *"
    - cron: "0-10 4 * * *"
    - cron: "50-59 9 * * *"
    - cron: "0-10 10 * * *"
    - cron: "50-59 12 * * *"
    - cron: "0-10 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "指定提醒時段（空白或 auto 代表依目前時間判斷）"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - day
          - morning
          - noon
          - evening
          - bedtime

permissions:
  contents: read

jobs:
  trigger-reminder-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

          SLOT=""
          NOT_BEFORE=""
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "50-59 22 * * *"|"0-10 23 * * *")
                SLOT="morning"
                NOT_BEFORE="07:00"
                ;;
              "50-59 23 * * *"|"0-10 0 * * *")
                SLOT="day"
                NOT_BEFORE="08:00"
                ;;
              "50-59 3 * * *"|"0-10 4 * * *")
                SLOT="noon"
                NOT_BEFORE="12:00"
                ;;
              "50-59 9 * * *"|"0-10 10 * * *")
                SLOT="evening"
                NOT_BEFORE="18:00"
                ;;
              "50-59 12 * * *"|"0-10 13 * * *")
                SLOT="bedtime"
                NOT_BEFORE="21:00"
                ;;
            esac
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_SLOT" ] && [ "$INPUT_SLOT" != "auto" ]; then
            SLOT="$INPUT_SLOT"
          fi

          URL="$APP_BASE_URL/api/cron/reminder"
          if [ -n "$SLOT" ]; then
            URL="$URL?slot=$SLOT"
            if [ -n "$NOT_BEFORE" ]; then
              URL="$URL&notBefore=$NOT_BEFORE"
            fi
          fi

          echo "Triggering slot: ${SLOT:-auto}"
          echo "Not before: ${NOT_BEFORE:-none}"
          echo "Request URL: $URL"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL"
