name: Medication Reminder Scheduler

on:
  # Times are UTC; Taiwan is UTC+8.
  # TW 07:00 => UTC 23:00 (previous day)
  # TW 08:00 => UTC 00:00
  # TW 12:00 => UTC 04:00
  # TW 18:00 => UTC 10:00
  # TW 21:00 => UTC 13:00
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-reminder-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/reminder"
