name: Medication Reminder Scheduler

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "指定提醒時段（空白或 auto 代表依目前時間判斷）"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - day
          - morning
          - noon
          - evening
          - bedtime
          - morning_tcm
          - noon_tcm
          - evening_tcm
      reset_dedupe:
        description: "只清空今日 dedupe（不發送訊息）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  trigger-reminder-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_RESET_DEDUPE: ${{ inputs.reset_dedupe }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

          SLOT="$INPUT_SLOT"
          if [ -z "$SLOT" ]; then
            SLOT="auto"
          fi

          URL="$APP_BASE_URL/api/cron/reminder"
          if [ "$SLOT" != "auto" ]; then
            URL="$URL?slot=$SLOT"
          fi
          if [ "$INPUT_RESET_DEDUPE" = "true" ]; then
            if echo "$URL" | grep -q "?"; then
              URL="$URL&reset=1"
            else
              URL="$URL?reset=1"
            fi
          fi
          if echo "$URL" | grep -q "?"; then
            URL="$URL&runId=$RUN_ID"
          else
            URL="$URL?runId=$RUN_ID"
          fi

          APP_BASE_HOST=$(echo "$APP_BASE_URL" | sed -E 's#https?://([^/]+)/?.*#\1#')

          echo "App base host: $APP_BASE_HOST"
          echo "Triggering slot: $SLOT"
          echo "Reset dedupe: ${INPUT_RESET_DEDUPE:-false}"
          echo "Request URL: $URL"

          RESPONSE=$(curl --silent --show-error \
            --write-out "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP_CODE: $HTTP_CODE"
          echo "RESPONSE_BODY: $BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 22
          fi
